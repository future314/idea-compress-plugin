# ---- Gradle ----
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---- Kotlin ----
kotlin.code.style=official
# The IntelliJ Platform ships kotlin-stdlib; do not bundle a second copy.
kotlin.stdlib.default.dependency=false

# ---- Plugin metadata ----
pluginGroup=com.lrong.compress
pluginName=File Compressor
pluginVersion=0.1.3
pluginSinceBuild=241
# pluginUntilBuild intentionally absent -> open-ended upper bound

# ---- IntelliJ Platform (compile/run target) ----
# IC, not IU: this plugin uses only platform APIs, so compiling against
# Community guarantees the resulting plugin also loads in Ultimate and in
# other IntelliJ-based IDEs. See plan section 2.
platformType=IC
platformVersion=2025.1.1
